<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg4)"/>

  <!-- Header bar -->
  <rect width="800" height="56" fill="#1a73e8"/>
  <text x="20" y="36" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Google Cloud</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="200" height="444" fill="#f1f5f9"/>

  <!-- Main content -->
  <rect x="200" y="56" width="600" height="444" fill="white"/>

  <!-- Page title and button -->
  <text x="240" y="100" font-family="Arial, sans-serif" font-size="22" fill="#202124" font-weight="500">Credentials</text>

  <!-- Create credentials button -->
  <rect x="240" y="120" width="180" height="36" rx="4" fill="#1a73e8"/>
  <text x="252" y="144" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="500">+ CREATE CREDENTIALS</text>

  <!-- Dropdown menu (shown) -->
  <rect x="240" y="160" width="200" height="140" rx="4" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
  <rect x="240" y="160" width="200" height="35" fill="#f8f9fa"/>
  <text x="256" y="183" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">API key</text>

  <rect x="240" y="195" width="200" height="35" fill="#e8f0fe"/>
  <text x="256" y="218" font-family="Arial, sans-serif" font-size="13" fill="#1a73e8" font-weight="500">OAuth client ID</text>
  <circle cx="428" cy="212" r="3" fill="#1a73e8"/>

  <rect x="240" y="230" width="200" height="35" fill="#f8f9fa"/>
  <text x="256" y="253" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">Service account</text>

  <rect x="240" y="265" width="200" height="35" fill="#f8f9fa"/>
  <text x="256" y="288" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">Help me choose</text>

  <!-- OAuth 2.0 Client IDs section -->
  <text x="240" y="340" font-family="Arial, sans-serif" font-size="16" fill="#202124" font-weight="500">OAuth 2.0 Client IDs</text>

  <!-- Table header -->
  <rect x="240" y="355" width="520" height="36" fill="#f8f9fa"/>
  <text x="256" y="378" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="500">Name</text>
  <text x="440" y="378" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="500">Type</text>
  <text x="560" y="378" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="500">Created</text>

  <!-- Empty state -->
  <rect x="240" y="391" width="520" height="60" fill="white" stroke="#dadce0" stroke-width="1"/>
  <text x="420" y="426" font-family="Arial, sans-serif" font-size="13" fill="#5f6368" text-anchor="middle">No OAuth clients yet. Click "CREATE CREDENTIALS" above.</text>

  <!-- Arrow pointing to OAuth client ID -->
  <path d="M 450 212 L 480 212" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea4335"/>
    </marker>
  </defs>
  <text x="490" y="216" font-family="Arial, sans-serif" font-size="12" fill="#ea4335" font-weight="bold">Select this!</text>
</svg>
