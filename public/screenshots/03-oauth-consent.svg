<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Header bar -->
  <rect width="800" height="56" fill="#1a73e8"/>
  <text x="20" y="36" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Google Cloud</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="200" height="444" fill="#f1f5f9"/>

  <!-- Main content -->
  <rect x="200" y="56" width="600" height="444" fill="white"/>

  <!-- Page title -->
  <text x="240" y="100" font-family="Arial, sans-serif" font-size="22" fill="#202124" font-weight="500">OAuth consent screen</text>

  <!-- User Type section -->
  <text x="240" y="150" font-family="Arial, sans-serif" font-size="16" fill="#202124" font-weight="500">User Type</text>
  <text x="240" y="175" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">Select the type of user this app will support</text>

  <!-- Internal option -->
  <rect x="240" y="200" width="520" height="80" rx="8" fill="white" stroke="#dadce0" stroke-width="1"/>
  <circle cx="268" cy="240" r="10" fill="none" stroke="#5f6368" stroke-width="2"/>
  <text x="292" y="230" font-family="Arial, sans-serif" font-size="14" fill="#202124" font-weight="500">Internal</text>
  <text x="292" y="250" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Only available to users within your organization</text>

  <!-- External option (selected) -->
  <rect x="240" y="295" width="520" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="268" cy="335" r="10" fill="#1a73e8"/>
  <circle cx="268" cy="335" r="4" fill="white"/>
  <text x="292" y="325" font-family="Arial, sans-serif" font-size="14" fill="#202124" font-weight="500">External</text>
  <text x="292" y="345" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Available to any user with a Google Account</text>

  <!-- Recommended badge -->
  <rect x="352" y="312" width="80" height="20" rx="10" fill="#e8f0fe"/>
  <text x="366" y="326" font-family="Arial, sans-serif" font-size="10" fill="#1a73e8" font-weight="500">Recommended</text>

  <!-- Create button -->
  <rect x="664" y="400" width="96" height="36" rx="4" fill="#1a73e8"/>
  <text x="689" y="424" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="500">CREATE</text>

  <!-- Info icon and text -->
  <circle cx="252" cy="440" r="8" fill="#1a73e8"/>
  <text x="250" y="444" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">i</text>
  <text x="270" y="444" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Select External for personal Gmail accounts</text>
</svg>
