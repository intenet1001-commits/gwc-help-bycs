<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect width="800" height="56" fill="#1a73e8"/>
  <text x="20" y="36" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Google Cloud</text>
  <text x="150" y="36" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Console</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="200" height="444" fill="#f1f5f9"/>
  <rect x="0" y="56" width="200" height="1" fill="#e2e8f0"/>

  <!-- Main content area -->
  <rect x="200" y="56" width="600" height="444" fill="white"/>

  <!-- Page title -->
  <text x="240" y="110" font-family="Arial, sans-serif" font-size="24" fill="#202124" font-weight="500">New Project</text>

  <!-- Form card -->
  <rect x="240" y="140" width="400" height="280" rx="8" fill="white" stroke="#dadce0" stroke-width="1"/>

  <!-- Project name field -->
  <text x="264" y="180" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Project name *</text>
  <rect x="264" y="190" width="352" height="40" rx="4" fill="white" stroke="#dadce0" stroke-width="1"/>
  <text x="276" y="216" font-family="Arial, sans-serif" font-size="14" fill="#202124">My GWS Project</text>

  <!-- Project ID field -->
  <text x="264" y="260" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Project ID</text>
  <rect x="264" y="270" width="352" height="40" rx="4" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text x="276" y="296" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">my-gws-project-12345</text>

  <!-- Location field -->
  <text x="264" y="340" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Location</text>
  <rect x="264" y="350" width="352" height="40" rx="4" fill="white" stroke="#dadce0" stroke-width="1"/>
  <text x="276" y="376" font-family="Arial, sans-serif" font-size="14" fill="#202124">No organization</text>

  <!-- Create button -->
  <rect x="520" y="410" width="96" height="36" rx="4" fill="#1a73e8"/>
  <text x="545" y="434" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="500">CREATE</text>

  <!-- Cancel button -->
  <rect x="410" y="410" width="96" height="36" rx="4" fill="white" stroke="#dadce0" stroke-width="1"/>
  <text x="438" y="434" font-family="Arial, sans-serif" font-size="14" fill="#1a73e8" font-weight="500">CANCEL</text>

  <!-- Indicator circles -->
  <circle cx="280" cy="212" r="4" fill="#1a73e8"/>
  <circle cx="280" cy="372" r="4" fill="#1a73e8"/>
</svg>
