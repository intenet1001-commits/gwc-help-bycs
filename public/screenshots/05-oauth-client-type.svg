<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg5)"/>

  <!-- Header bar -->
  <rect width="800" height="56" fill="#1a73e8"/>
  <text x="20" y="36" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Google Cloud</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="200" height="444" fill="#f1f5f9"/>

  <!-- Main content -->
  <rect x="200" y="56" width="600" height="444" fill="white"/>

  <!-- Page title -->
  <text x="240" y="100" font-family="Arial, sans-serif" font-size="22" fill="#202124" font-weight="500">Create OAuth client ID</text>

  <!-- Application type section -->
  <text x="240" y="145" font-family="Arial, sans-serif" font-size="14" fill="#202124" font-weight="500">Application type *</text>

  <!-- Dropdown -->
  <rect x="240" y="160" width="400" height="44" rx="4" fill="white" stroke="#dadce0" stroke-width="1"/>
  <text x="256" y="188" font-family="Arial, sans-serif" font-size="14" fill="#202124">Select application type</text>

  <!-- Dropdown expanded -->
  <rect x="240" y="204" width="400" height="200" rx="4" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>

  <rect x="240" y="204" width="400" height="40" fill="#f8f9fa"/>
  <text x="256" y="230" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">Web application</text>

  <rect x="240" y="244" width="400" height="40" fill="#f8f9fa"/>
  <text x="256" y="270" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">Android</text>

  <rect x="240" y="284" width="400" height="40" fill="#f8f9fa"/>
  <text x="256" y="310" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">iOS</text>

  <!-- Desktop app option (highlighted) -->
  <rect x="240" y="324" width="400" height="40" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="256" y="350" font-family="Arial, sans-serif" font-size="14" fill="#1a73e8" font-weight="500">Desktop app</text>

  <rect x="240" y="364" width="400" height="40" fill="#f8f9fa"/>
  <text x="256" y="390" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">TVs and Limited Input devices</text>

  <!-- Warning callout -->
  <rect x="500" y="310" width="260" height="70" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="516" y="335" font-family="Arial, sans-serif" font-size="12" fill="#856404" font-weight="bold">Important!</text>
  <text x="516" y="355" font-family="Arial, sans-serif" font-size="11" fill="#856404">Select "Desktop app"</text>
  <text x="516" y="370" font-family="Arial, sans-serif" font-size="11" fill="#856404">NOT "Web application"</text>

  <!-- Arrow -->
  <path d="M 490 344 L 655 344" stroke="#ffc107" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="490,340 480,344 490,348" fill="#ffc107"/>
</svg>
