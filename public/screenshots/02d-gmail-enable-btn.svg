<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" fill="#f8f9fa" rx="6"/>
  <rect width="800" height="48" fill="#1a73e8" rx="6"/>
  <rect y="42" width="800" height="6" fill="#1a73e8"/>
  <text x="46" y="29" fill="white" font-family="sans-serif" font-size="13" font-weight="600">Google Cloud</text>
  <rect x="170" y="10" width="150" height="28" rx="4" fill="white" opacity="0.2"/>
  <text x="245" y="29" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">GWS CLI ▾</text>
  <!-- Breadcrumb -->
  <text x="20" y="72" fill="#5f6368" font-family="sans-serif" font-size="11">API 라이브러리 › Gmail API</text>
  <!-- API header section -->
  <rect x="20" y="84" width="760" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Gmail icon -->
  <rect x="40" y="104" width="48" height="48" rx="8" fill="#EA4335"/>
  <text x="64" y="134" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">M</text>
  <!-- API info -->
  <text x="104" y="118" fill="#202124" font-family="sans-serif" font-size="17" font-weight="600">Gmail API</text>
  <text x="104" y="136" fill="#5f6368" font-family="sans-serif" font-size="11">Google Enterprise API</text>
  <text x="104" y="155" fill="#5f6368" font-family="sans-serif" font-size="11">이메일 액세스 및 관리를 위한 유연한 RESTful API 액세스</text>
  <!-- Enable button - highlighted with red circle -->
  <rect x="40" y="164" width="72" height="32" rx="4" fill="#1a73e8"/>
  <text x="76" y="184" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="600">사용</text>
  <!-- Red annotation circle -->
  <circle cx="124" cy="180" r="16" fill="#FF3B3B"/>
  <text x="124" y="185" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="900">①</text>
  <!-- Arrow label -->
  <text x="148" y="185" fill="#FF3B3B" font-family="sans-serif" font-size="12" font-weight="700">← 클릭!</text>
  <!-- Info section below -->
  <rect x="20" y="218" width="760" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>
  <text x="40" y="242" fill="#1a73e8" font-family="sans-serif" font-size="12" font-weight="600">파란 "사용" 버튼 클릭 → 잠시 기다리면 "사용 설정됨" 상태로 바뀝니다</text>
  <text x="40" y="264" fill="#1a73e8" font-family="sans-serif" font-size="11">나머지 5개 API도 같은 방법으로 검색 후 "사용" 클릭:</text>
  <text x="40" y="284" fill="#1a73e8" font-family="sans-serif" font-size="11">Drive · Calendar · Sheets · Docs · Tasks</text>
  <!-- Status tags -->
  <rect x="20" y="322" width="120" height="24" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="80" y="338" text-anchor="middle" fill="#137333" font-family="sans-serif" font-size="11" font-weight="600">사용 설정됨 ✓</text>
  <text x="155" y="338" fill="#5f6368" font-family="sans-serif" font-size="11">← 클릭 후 이렇게 바뀝니다</text>
</svg>
